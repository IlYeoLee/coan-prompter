<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>코안 발표 대본</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="코안 대본">
<meta name="theme-color" content="#0d1014">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 화면 프롬프터: 위 = 페이지, 가운데 = 지금 말할 문장(크게), 아래 = 진행 표시와 버튼. 발표장에서 눈부시지 않게 어두운 화면 하나로 고정 */
:root{
  --bg:#0d1014; --panel:#171b21; --line:#262c35;
  --fg:#f2f4f7; --dim:#7d8693; --faint:#4a525d;
  --go:#3d8bff; --soon:#ffb020; --now:#2fd27a; --said:#9fc2ff;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pg{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:10px;padding:7px 10px;font:500 12px/1.2 var(--sans)}
.pg b{display:block;font-weight:700;font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.pg.vid b::after{content:" ▶";font-size:10px;color:var(--go)}
.pg[aria-current=true]{border-color:var(--go);color:var(--fg)}
.enterbar{border-radius:14px;font-weight:700;font-size:22px;text-align:center;min-height:0}
.enter .enterbar{background:var(--now);color:#06210f;padding:14px}
.stage{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0;overflow:hidden}
.prev{color:var(--faint);font-size:16px;line-height:1.5;max-height:3em;overflow:hidden;word-break:keep-all}
.cur{font-size:clamp(26px,7.4vw,40px);line-height:1.45;font-weight:700;word-break:keep-all;text-wrap:pretty}
.cur .s{color:var(--said)}
.next{color:var(--dim);font-size:19px;line-height:1.55;word-break:keep-all;max-height:4.7em;overflow:hidden}
.next::before{content:"다음 ";color:var(--faint);font-size:13px;font-weight:700;margin-right:4px}
.flash .cur{color:var(--now)}
.meter{display:grid;gap:8px}
.cd{display:flex;align-items:baseline;justify-content:space-between;font-variant-numeric:tabular-nums}
.cd .big{font-size:44px;font-weight:700;line-height:1;color:var(--go)}
.cd .lab{font-size:15px;color:var(--dim)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--go);transform-origin:left}
.soon .cd .big,.soon .cd .lab{color:var(--soon)}.soon .bar i{background:var(--soon)}
.mic{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);min-height:22px}
.mic i{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.mic.on i{background:var(--now);box-shadow:0 0 0 4px rgba(47,210,122,.18)}
.heard{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;flex:1;min-width:0}
.clock{font-variant-numeric:tabular-nums;color:var(--faint);font-size:13px;text-align:right}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.ctl button{min-width:0;padding:0;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 15px var(--sans)}
.ctl button:active{background:var(--line)}
.ctl button:disabled{opacity:.35}
.ctl .main{background:var(--go);border-color:var(--go);font-weight:700;font-size:17px}
.paused .ctl .main{background:var(--now);border-color:var(--now);color:#06210f}
/* 앱 설치 안내 토스트 */
.toast{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:20;display:flex;align-items:center;gap:10px;padding:14px 14px 14px 18px;border-radius:16px;background:var(--fg);color:var(--bg);font:500 15px/1.45 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast span{flex:1;min-width:0;word-break:keep-all}
.toast button{flex:none;border:0;border-radius:10px;font:700 15px var(--sans);padding:10px 14px;background:var(--go);color:#fff}
.toast #tx{background:transparent;color:var(--bg);padding:10px 6px}
.total{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--dim);text-align:right}
.total b{color:var(--fg)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<div class="toast" id="toast" hidden><span id="toastT"></span><button id="inst">설치</button><button id="tx" aria-label="닫기">✕</button></div>
<div class="app" id="app">
  <nav class="pages" id="pages" aria-label="페이지"></nav>
  <div class="enterbar" id="enter" aria-live="assertive"></div>
  <main class="stage" id="stage">
    <div class="prev" id="prev"></div>
    <div class="cur" id="cur" aria-live="polite"></div>
    <div class="next" id="next"></div>
  </main>
  <section>
    <div class="meter" id="meter" hidden>
      <div class="cd"><span class="lab" id="lab"></span><span class="big" id="big"></span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="mic" id="mic"><i></i><span id="micT">마이크 꺼짐</span><span class="heard" id="heard"></span></div>
    <div class="clock" id="clock"></div>
    <div class="clock" id="upd"></div>
    <div class="total" id="total"></div>
    <div class="ctl">
      <button id="bk">−1초</button>
      <button id="pl">‹ 문장</button>
      <button id="go" class="main">시작</button>
      <button id="nl">문장 ›</button>
      <button id="fw">+1초</button>
    </div>
  </section>
</div>
<script>
// 카카오톡 안에서 열면 홈 화면 추가가 없어서, 기본 브라우저로 다시 엶
if (/KAKAOTALK/i.test(navigator.userAgent)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
// 앱 설치 안내: 안드로이드 크롬은 설치 창을 바로 띄우고, 아이폰은 방법을 알려 줌. 이미 앱으로 열었으면 안 띄움
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let instEv = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEv = e; toast('홈 화면에 앱으로 설치하면 전체 화면으로 열려요', true) });
function toast(t, btn) { if (standalone) return; document.getElementById('toastT').textContent = t; document.getElementById('inst').hidden = !btn; document.getElementById('toast').hidden = false }
document.getElementById('inst').onclick = async () => { if (!instEv) return; instEv.prompt(); await instEv.userChoice.catch(() => {}); instEv = null; document.getElementById('toast').hidden = true };
document.getElementById('tx').onclick = () => document.getElementById('toast').hidden = true;
if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) setTimeout(() => toast(/CriOS/.test(navigator.userAgent) ? '앱으로 설치: 주소창 오른쪽 공유 버튼 → 홈 화면에 추가' : '앱으로 설치: 아래 공유 버튼 → 홈 화면에 추가', false), 600);
setTimeout(() => { if (!instEv && !standalone && /Android/.test(navigator.userAgent)) toast('앱으로 설치: 오른쪽 위 ⋮ 메뉴 → 홈 화면에 추가', false) }, 2500);
// 00~04 = 정지 페이지: 내가 말하는 속도대로. 문장을 끝까지 말하면 음성인식이 알아듣고 넘김(화면 탭도 됨)
// 05~07 = 영상 페이지: 영상과 같은 시각표대로 시계가 넘김. 페이지가 바뀌는 순간 "지금 Enter"(노트북에서 Enter만 누르면 됨)
let STATIC = {"p0":["판단은 제가 직접 하고, 반복은 Claude Code에 맡겨 코안을 만들었습니다.","Discover에서는 Python 크롤러로 회의 상황과 불만 키워드가 담긴 글을 모으고, 약한 검색어는 버리고 다시 모았습니다.","Define에서는 서브에이전트가 글마다 실제로 겪은 장면인지 판정하고, 첫 판정을 가린 채 다시 판정했습니다. 결과는 Google Sheets MCP로 시트에 남겼습니다.","Develop에서는 Figma MCP로 디자인 시스템을 Figma와 코드에 같은 이름으로 만들고, 플레이그라운드에서 확인하며 마흔두 번 다듬었습니다.","Deliver에서는 Codex CLI와 GPT Image로 장면 스케치를 그려 Figma에 정리하고, Claude Docs로 인용과 수치를 원문과 대조했습니다.","먼저 찾은 문제부터 말씀드리겠습니다."],"p1":["회의는 끝나도, 결정은 끝나지 않습니다.","사용자 글 만 오천여 건을 모으고, 실제로 겪은 장면이 담긴 예순한 건만 근거로 남겨 세 문제로 나눴습니다.","첫째, AI 요약을 그대로 믿기 어렵습니다. 조건부 찬성이 요약에는 그냥 동의로 적혔다는 글이 있었고, 설문에서도 48%가 부정확함을 단점 1위로 꼽았습니다.","둘째, 정한 내용이 다음 날 뒤집힙니다. 같이 정하고도 다음 날 다른 말을 한다는 글이 반복됐고, 55%가 다음 단계가 불명확하다고 답했습니다.","셋째, 누가 맡았는지 분명하지 않습니다. 다시 공유하겠다고 하고 사흘째 소식이 없다는 글이 있었고, 54%가 담당을 모른 채 회의를 떠난다고 답했습니다.","따라서 세 가설을 세웠습니다. 회의 중에 미정을 따로 보여 주면, 미정이 합의로 바뀌는 일이 줄어들 것입니다.","끝나기 전에 함께 정하면 다음 날에도 같은 결정이 남고, 본인이 직접 확인하면 맡은 일을 끝까지 챙길 가능성이 커집니다."],"p2":["기록하고 요약하는 AI는 많지만, 회의 안에서 확정을 돕는 AI는 없습니다.","열여섯 개 서비스를 공식 문서로 비교했습니다. 할 일 정리는 열다섯 곳이 지원하지만, 결정 이유 남기기, AI가 먼저 미결 묻기, 담당자 본인 확인을 온전히 갖춘 곳은 한 곳도 없었습니다.","가장 가까운 세 서비스에서는 하나씩 빌렸습니다. 구글 미트에서는 결정 상태를, 팀즈에서는 AI가 먼저 말을 거는 타이밍을, 줌에서는 버튼 한 번의 수락을 가져왔습니다.","다만 세 서비스 모두 회의가 끝난 뒤에 AI가 정리합니다. 코안은 이것을 회의 중에 당사자가 확정하는 흐름으로 이었습니다."],"p3":["코안은 회의가 끝나기 전에, 참석자 모두가 같은 결정을 확정하도록 돕는 AI 회의 동료입니다.","목요일 디자인 시스템 회의에서, Button S를 없앨지 정하는 장면으로 보여 드리겠습니다.","지금은 하은이 받아 적느라 대화에서 빠지고, 수아의 우려는 묻힙니다. 코안과 함께면 말하는 동안 결정 줄이 서고, 우려와 근거가 그 줄에 붙습니다.","지금은 시간이 다 되면 정하지 못한 채 메신저로 미룹니다. 코안과 함께면 끝나기 5분 전에 두 안을 회의실 TV에 띄워 함께 고릅니다.","지금은 AI 요약이 기울던 안을 확정으로 적어, 태호는 다음 주에야 자기 일인 걸 압니다. 코안과 함께면 태호가 직접 확인해야 확정되고, Figma 브랜치와 개발 티켓 초안이 준비됩니다.","이 세 장면이 결정 정리, 함께 정하기, 각자 확인, 세 핵심 화면입니다."],"p4":["의견을 잇는 선 하나가, 브랜드이자 화면의 규칙이 됩니다.","코안은 함께 정하는 안이라는 뜻입니다. 논의 중에는 열린 C, 합의하면 닫힌 O가 됩니다.","같은 선의 형태로, 듣기부터 합의까지 열두 가지 상태를 보여 줍니다.","이 선은 컴포넌트의 규칙이 됩니다. 새 결정이 생기면 선이 테두리가 되고, 근거를 누르면 그 발언에 선이 그어집니다.","디자인 시스템과 컴포넌트 라이브러리는 Figma와 코드에 같은 이름으로 만들어, 값 하나를 바꾸면 모든 화면이 함께 바뀝니다.","이제 핵심 화면 세 개를 보여 드리겠습니다."]}, VIDEO = {"1":{"end":47.91,"cues":[[0,"첫 번째 화면은 결정 정리입니다. 회의 중에 오간 말을 결정 목록으로 정리합니다."],[6.63,"회의 전, 코안이 안건마다 필요한 자료를 미리 붙여 둡니다."],[12.08,"이제 회의를 시작해 보겠습니다."],[15.63,"회의 화면입니다. 왼쪽은 대화 기록, 오른쪽은 결정 목록입니다."],[21.85,"누군가 제안하면 오른쪽에 정할 것이 생기고, 그에 대한 우려와 근거가 같은 줄에 모입니다."],[29.6,"의견이 갈리면, 두 안과 각 안을 주장한 말을 한 장에 나란히 정리합니다. 누가 왜 그 안을 원했는지, 다시 묻지 않아도 됩니다."],[40.05,"회의가 끝나기 전에, 무엇이 정해졌고 무엇이 남았는지가 한눈에 보입니다."]]},"2":{"end":51.05,"cues":[[0,"두 번째 화면은 함께 정하기입니다. 끝나기 5분 전에 남은 결정을 함께 정합니다."],[6.59,"회의가 5분 남았는데 못 정한 결정이 있으면, 진행자에게 알림이 옵니다."],[13.33,"TV에 띄우면, 회의실의 모두가 같은 화면을 봅니다."],[19.13,"코안은 두 안 중 하나를 골랐을 때 생길 일을 미리 보여 줍니다."],[24.58,"A안이면 바뀌는 어드민 화면을, 팀 Figma에 실제로 적용해 보여 주고,"],[30.6,"B안이면 바뀌는 코드와 일정까지 보여 줍니다. 추천은 하지 않고, 결정은 팀이 합니다."],[38.24,"팀이 B안을 고르면, 그 결정은 곧바로 맡은 사람의 할 일이 됩니다."],[44.22,"남은 결정은 다음 회의로 미뤄지지 않고, 그 자리에서 정해집니다."]]},"3":{"end":49.27,"cues":[[0,"세 번째 화면은 각자 확인입니다. 맡은 사람이 직접 결정을 확인합니다."],[5.67,"담당자에게는 자기 노트북으로 확인 요청이 옵니다."],[12.55,"회의에서 본인이 한 말이 근거로 붙어 있어서, 내용만 보고 확인하면 됩니다."],[19.23,"두 사람이 확인하면 결정이 확정되고,"],[24.34,"코안이 Figma 브랜치와 변경 로그, 개발 티켓 초안을 써 둡니다. 담당자는 검토하고 실행만 하면 됩니다."],[32.75,"회의가 끝나면 모든 결정이 기록으로 남고,"],[36.81,"근거 보기로, 그때 한 말을 언제든 다시 확인할 수 있습니다."],[42.33,"결국 누가 무엇을 맡았는지가, 말이 아니라 기록으로 남습니다."]]},"p4":{"end":51.71,"cues":[[0,"의견을 잇는 선 하나가, 브랜드이자 화면의 규칙이 됩니다."],[7.59,"코안은 함께 정하는 안이라는 뜻입니다. 논의 중에는 열린 C, 합의하면 닫힌 O가 됩니다."],[13.33,"같은 선의 형태로, 듣기부터 합의까지 열두 가지 상태를 보여 줍니다."],[20.45,"이 선은 컴포넌트의 규칙이 됩니다. 새 결정이 생기면 선이 테두리가 되고, 근거를 누르면 그 발언에 선이 그어집니다."],[30.51,"디자인 시스템과 컴포넌트 라이브러리는 Figma와 코드에 같은 이름으로 만들어, 값 하나를 바꾸면 모든 화면이 함께 바뀝니다."],[45.37,"이제 핵심 화면 세 개를 보여 드리겠습니다."]]}};
// 웹 대본이 바뀌면 data.json이 새로 올라옴 → 30초마다 확인해서 새로고침 없이 바꿈(영상 페이지 재생 중엔 끝난 뒤에)
let pending = null, stamp = 1793170401746;
const BUILD = '22e46f90c7';   // 화면 코드 버전: 바뀌면 새로고침(진행 위치는 유지)
async function poll() {
  try { const d = await (await fetch('data.json?t=' + Date.now(), { cache: 'no-store' })).json(); if (d.stamp > stamp) pending = d; if (d.build && d.build !== BUILD) reloadWanted = d.build } catch {}
  if (reloadWanted && !(isVid(pi) && playing)) { try { sessionStorage.setItem('pos', JSON.stringify({ pi, line, started })) } catch {} location.replace(location.pathname + '?v=' + reloadWanted); return }   // 주소를 바꿔야 휴대폰에 저장된 옛 화면을 건너뜀
  if (pending && !(isVid(pi) && playing)) { STATIC = pending.static; VIDEO = pending.video; stamp = pending.stamp; pending = null; tabs(); line = Math.min(line, lines().length - 1); last = -1; $('upd').textContent = '대본 업데이트됨 ' + new Date().toTimeString().slice(0, 5) }
}
let reloadWanted = false;
setInterval(poll, 30000); poll();   // 열자마자 한 번 확인(옛 화면이면 바로 새로 받음)
const PAGES = [
  ['p0','00','AI 워크플로우'],['p1','01','문제 정의'],['p2','02','벤치마킹'],['p3','03','코안 소개'],['p4','04','비주얼 시스템'],
  ['1','05','결정 정리'],['2','06','함께 정하기'],['3','07','각자 확인']];
const isVid = i => !!VIDEO[PAGES[i][0]];
const $ = id => document.getElementById(id);
let pi = 0, line = 0, playing = false, base = 0, t0 = 0, started = false, startedAt = 0;
const RATE = 5.6;   // film.html과 같은 말 속도(글자/초)
const spSec = t => [...t].reduce((a, c) => a + (/[가-힣0-9]/.test(c) ? 1 / RATE : /[A-Za-z]/.test(c) ? .45 / RATE : c === ',' ? .18 : /[.?!]/.test(c) ? .3 : 0), 0) + .9;
const expect = () => PAGES.reduce((a, [k]) => a + (VIDEO[k] ? VIDEO[k].end : STATIC[k].reduce((b, t) => b + spSec(t), 0)), 0);
const V = () => VIDEO[PAGES[pi][0]];
const lines = () => isVid(pi) ? V().cues.map(c => c[1]) : STATIC[PAGES[pi][0]];
const now = () => playing ? base + (performance.now() - t0) / 1000 : base;
const setT = s => { base = Math.max(0, Math.min(V().end, s)); t0 = performance.now() };
const idxAt = s => { const c = V().cues; let k = 0; while (k + 1 < c.length && c[k + 1][0] <= s + 1e-3) k++; return k };

const tabs = () => { $('pages').innerHTML = PAGES.map((p, i) => `<button class="pg${isVid(i) ? ' vid' : ''}" data-i="${i}" aria-current="${i === pi}"><b>${p[1]}</b>${p[2]}</button>`).join('') }; tabs();
$('pages').onclick = e => { const b = e.target.closest('.pg'); if (b) openPage(+b.dataset.i, false) };

let enterUntil = 0;
function openPage(i, auto) {
  pi = i; line = 0; resetHeard();
  if (isVid(pi)) { playing = auto; setT(0) } else playing = false;
  if (auto) { enterUntil = performance.now() + 1800; $('enter').textContent = `지금 Enter ⏎  ${PAGES[pi][1]} ${PAGES[pi][2]}` }
  document.querySelectorAll('.pg').forEach((b, k) => b.setAttribute('aria-current', k === pi));
  document.querySelector('.pg[aria-current=true]').scrollIntoView({ inline: 'center', block: 'nearest' });
  last = -1;
}
// 다음 문장. 페이지 마지막 문장이면 다음 페이지로(영상 페이지면 시계 시작)
const STAT = { 끝부분: 0, 멈춤: 0, 탭: 0 };   // 정지 페이지 문장이 무엇으로 넘어갔는지(연습 때 정확도 확인용)
function advance(how = '탭') {
  STAT[how]++;
  if (line + 1 < lines().length) { line++; resetHeard(); last = -1; flash() }
  else if (pi + 1 < PAGES.length) openPage(pi + 1, true);
}
function flash() { $('app').classList.add('flash'); setTimeout(() => $('app').classList.remove('flash'), 600) }

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let last = -1;
function draw() {
  const vid = isVid(pi), L = lines();
  if (vid) {
    const k = idxAt(now()); if (k !== line) { if (k > line) flash(); line = k; last = -1 }
  }
  if (line !== last) {
    $('prev').textContent = L[line - 1] || '';
    $('next').textContent = L[line + 1] || (pi + 1 < PAGES.length ? `Enter ⏎ ${PAGES[pi + 1][1]} ${PAGES[pi + 1][2]}` : '끝');
    last = line;
  }
  // 정지 페이지: 말한 만큼 문장 앞부분을 칠함
  const cur = L[line] || '', upto = vid ? 0 : saidUpto(cur);
  $('cur').innerHTML = `<span class="s">${esc(cur.slice(0, upto))}</span>${esc(cur.slice(upto))}`;
  $('app').classList.toggle('enter', performance.now() < enterUntil);
  $('meter').hidden = !vid;
  $('bk').disabled = $('fw').disabled = !vid;
  if (vid) {
    const s = now(), c = V().cues, end = V().end, a = c[line][0], b = c[line + 1]?.[0] ?? end, left = Math.max(0, b - s);
    $('big').textContent = left.toFixed(1);
    $('lab').textContent = c[line + 1] ? '다음 문장까지' : pi + 1 < PAGES.length ? `Enter까지 → ${PAGES[pi + 1][1]}` : '끝까지';
    $('bar').style.transform = `scaleX(${b > a ? left / (b - a) : 0})`;
    $('app').classList.toggle('soon', left <= 2 && left > 0);
    $('clock').textContent = `${PAGES[pi][1]} 영상 ${fmt(s)} / ${fmt(end)}${playing ? '' : ' · 멈춤'}`;
    if (playing && s >= end) { if (pi + 1 < PAGES.length) openPage(pi + 1, true); else playing = false }
    $('go').textContent = playing ? '멈춤' : '계속';
  } else {
    $('app').classList.remove('soon');
    $('clock').textContent = `${PAGES[pi][1]} 페이지 ${line + 1} / ${L.length}문장 · 자동 ${STAT.끝부분 + STAT.멈춤}(끝부분 ${STAT.끝부분}, 멈춤 ${STAT.멈춤}) / 탭 ${STAT.탭}`;
    $('go').textContent = started ? '다음 ›' : '시작';
  }
  $('app').classList.toggle('paused', vid && !playing);
  // 전체 소요 시간: 시작을 누른 뒤 흐른 시간 / 예상(정지 페이지는 웹과 같은 말 속도로 계산, 영상 페이지는 시각표 길이)
  const run = startedAt ? (performance.now() - startedAt) / 1000 : 0;
  $('total').innerHTML = `전체 <b>${fmt(run)}</b> / 예상 ${fmt(expect())}`;
}
const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

// ---- 음성인식(브라우저 기본 기능, 무료). 지금 문장의 끝부분을 말했으면 다음 문장으로 ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micOn = false, heard = '', finalBase = '';
const norm = t => t.replace(/[^가-힣]/g, '');   // 한글만 비교(영어·숫자는 음성인식이 자주 틀려서 판정에서 뺌)
const grams = t => { const g = new Set(); for (let i = 0; i + 1 < t.length; i++) g.add(t.slice(i, i + 2)); return g };
const cover = (target, said) => { const g = [...grams(target)]; if (!g.length) return 1; const s = grams(said); return g.filter(x => s.has(x)).length / g.length };
function resetHeard() { finalBase = heardAll; }
let heardAll = '';
// 말한 범위: 문장을 앞에서부터 늘려 가며 들은 말과 70% 이상 겹치는 가장 긴 앞부분
function saidUpto(cur) {
  const said = norm(heardAll.slice(finalBase.length)); if (!said) return 0;
  let best = 0;
  for (let i = 4; i <= cur.length; i += 2) if (cover(norm(cur.slice(Math.max(0, i - 10), i)), said) >= .7) best = i;
  return best;
}
function check() {
  if (isVid(pi)) return;
  const cur = norm(lines()[line] || ''), said = norm(heardAll.slice(finalBase.length));
  const tail = cur.slice(-Math.min(10, Math.ceil(cur.length / 3)));
  // ① 끝부분까지 말했으면 바로 넘김
  if (said.length >= cur.length * .5 && cover(tail, said.slice(-tail.length - 8)) >= .6) advance('끝부분');
}
// ② 문장의 60% 이상을 말하고 0.9초 동안 말이 없으면 넘김(끝부분을 잘못 알아들어도 숨 쉬는 틈으로 판단)
let lastHeard = 0;
setInterval(() => {
  if (!micOn || isVid(pi) || !lastHeard || performance.now() - lastHeard < 900) return;
  const cur = norm(lines()[line] || ''), said = norm(heardAll.slice(finalBase.length));
  if (said && cover(cur, said) >= .6) { lastHeard = 0; advance('멈춤') }
}, 150);
function startMic() {
  if (!SR) { $('micT').textContent = '이 브라우저는 음성인식이 안 돼요. 화면을 탭해서 넘겨요'; return }
  rec = new SR(); rec.lang = 'ko-KR'; rec.continuous = true; rec.interimResults = true;
  let done = '';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) done += r[0].transcript + ' '; else interim += r[0].transcript }
    heardAll = prevSessions + done + interim; lastHeard = performance.now(); $('heard').textContent = heardAll.slice(-40); check();
  };
  rec.onend = () => { prevSessions += done; done = ''; if (micOn) try { rec.start() } catch {} };   // 아이폰은 조용하면 끊김 → 다시 켬
  rec.onerror = e => { if (e.error === 'not-allowed') { micOn = false; $('micT').textContent = '마이크 권한이 없어요. 화면을 탭해서 넘겨요' } };
  micOn = true; try { rec.start() } catch {}
  $('mic').classList.add('on'); $('micT').textContent = '듣는 중';
}
let prevSessions = '';

// ---- 버튼 ----
$('go').onclick = () => {
  if (!started) { started = true; startedAt = performance.now(); startMic(); return }
  if (isVid(pi)) { setT(now()); playing = !playing; t0 = performance.now() } else advance();
};
$('stage').onclick = () => { if (started && !isVid(pi)) advance() };
$('bk').onclick = () => isVid(pi) && setT(now() - 1);
$('fw').onclick = () => isVid(pi) && setT(now() + 1);
const jump = d => {
  if (isVid(pi)) { const c = V().cues, k = Math.max(0, Math.min(c.length - 1, idxAt(now()) + d)); setT(c[k][0]) }
  else if (d > 0) advance(); else if (line > 0) { line--; resetHeard(); last = -1 } else if (pi > 0) { openPage(pi - 1, false); line = lines().length - 1 }
};
$('pl').onclick = () => jump(-1); $('nl').onclick = () => jump(1);
$('mic').onclick = () => { if (!started) return; if (micOn) { micOn = false; rec?.stop(); $('mic').classList.remove('on'); $('micT').textContent = '마이크 꺼짐(탭하면 켜짐)' } else startMic() };
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());
document.addEventListener('click', wake, { once: true });
openPage(0, false);
// 새로고침 전 위치로 돌아감(마이크는 브라우저 정책상 '시작'을 다시 눌러야 켜짐)
try { const s = JSON.parse(sessionStorage.getItem('pos') || 'null'); sessionStorage.removeItem('pos'); if (s) { openPage(s.pi, false); line = Math.min(s.line, lines().length - 1); last = -1 } } catch {}
(function loop() { draw(); requestAnimationFrame(loop) })();   // 모든 변수가 준비된 뒤 시작
</script>
</body>
</html>
